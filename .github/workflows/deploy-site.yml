name: Deploy site to GitHub Pages

# Builds Site/ (the React/Vite app from Plans/UFA_Analysis.md Phase 6) on
# every branch push that touches it, as a build-only smoke test — but only
# actually deploys to GitHub Pages from `main`.
#
# This does NOT re-run the Python pipeline (fetch/clean/model/export) — it
# builds from whatever Site/public/data/*.json is already committed. The
# plan notes rerunning the pipeline on a schedule as an *optional* later
# enhancement; that would need a separate job installing the Python deps
# and running Modeling/scripts/export_site_data.py before this build step.
#
# Requires GitHub Pages to be enabled for this repo with source "GitHub
# Actions" (Settings -> Pages) before this workflow can deploy anything.

on:
  push:
    branches: ["**"]
    paths:
      - "Site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Site/package-lock.json

      - name: Install dependencies
        working-directory: Site
        run: npm ci

      # Runs on every branch push — a build-only smoke test so a broken
      # site is caught before it ever reaches main, not just at deploy time.
      - name: Build
        working-directory: Site
        run: npm run build

      # Only main goes on to produce a Pages artifact.
      - if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: Site/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
