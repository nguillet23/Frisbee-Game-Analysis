[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ufa-analysis"
version = "0.1.0"
description = "UFA advanced-stats pipeline and player performance model"
requires-python = ">=3.11"
dependencies = [
    "audl",
    "pandas==2.2.3",
    "requests",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]
